apiVersion: v1
kind: Service
metadata:
  name: omnitrack-metrics
  namespace: omnitrack
  labels:
    app.kubernetes.io/name: omnitrack
    app.kubernetes.io/component: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: omnitrack
    app.kubernetes.io/component: backend
  ports:
    - name: metrics
      port: 8000
      targetPort: http
      protocol: TCP
