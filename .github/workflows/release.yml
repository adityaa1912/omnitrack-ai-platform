name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (must match an existing vX.Y.Z tag)
        required: true
        type: string

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.verify.outputs.version }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tag exists and images are built
        id: verify
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be vX.Y.Z"
            exit 1
          fi
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import os, subprocess, sys
          version = os.environ['VERSION']
          if not version.startswith('v') or not version[1:].count('.') == 2:
              print('::error::version must be vX.Y.Z'); sys.exit(1)
          ref = subprocess.run(
              ['git', 'rev-parse', f'refs/tags/{version}^{{commit}}'],
              capture_output=True, text=True)
          if ref.returncode != 0:
              print(f'::error::tag {version} not found'); sys.exit(1)
          print(f'sha={ref.stdout.strip()}')
          print(f'version={version}')
          EOF
      - name: Confirm CI passed on the tagged commit
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ steps.verify.outputs.sha }}/check-runs" \
            > "$RUNNER_TEMP/check-runs.json"
          python - <<'EOF'
          import json, os
          runs = json.load(open(os.environ['RUNNER_TEMP'] + '/check-runs.json'))['check_runs']
          if not runs:
              print('::error::no CI check-runs found for the tagged commit')
              sys.exit(1)
          if not any(r.get('conclusion') == 'success' for r in runs):
              print('::error::no successful CI check-run for the tagged commit')
              sys.exit(1)
          print('check-runs:', len(runs))
          EOF

  production-deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure cluster access
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
      - name: Validate manifests
        run: kubectl apply --dry-run=client -f kubernetes/ --validate=false
      - name: Migration safety check
        run: python scripts/ci/check_migrations.py
      - name: Run migrations (production)
        run: |
          image="ghcr.io/${{ github.repository_owner }}/omnitrack-backend:${{ needs.gate.outputs.version }}"
          image="${image,,}"
          kubectl -n omnitrack run migrate-${{ needs.gate.outputs.sha }} --rm -i \
            --image "$image" \
            --restart=Never -- alembic upgrade head
      - name: Deploy backend (production)
        run: |
          image="ghcr.io/${{ github.repository_owner }}/omnitrack-backend:${{ needs.gate.outputs.version }}"
          image="${image,,}"
          python scripts/ci/deploy.py \
            --namespace omnitrack \
            --deployment omnitrack-backend \
            --container backend \
            --image "$image" \
            --timeout 600 \
            --smoke-url http://omnitrack-backend.omnitrack.svc.cluster.local:8000/health
      - name: Deploy frontend (production)
        run: |
          image="ghcr.io/${{ github.repository_owner }}/omnitrack-frontend:${{ needs.gate.outputs.version }}"
          image="${image,,}"
          python scripts/ci/deploy.py \
            --namespace omnitrack \
            --deployment omnitrack-frontend \
            --container frontend \
            --image "$image" \
            --timeout 600

  report:
    needs: [gate, production-deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open deployment failure issue
        uses: actions/github-script@v7
        env:
          VERSION: ${{ inputs.version }}
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Production deploy failed: ${process.env.VERSION}`,
              labels: ['deployment-failure'],
              body: `Deploy of ${process.env.VERSION} failed and was rolled back.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
