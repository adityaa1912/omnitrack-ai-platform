services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omnitrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnitrack}
      POSTGRES_DB: ${POSTGRES_DB:-omnitrack}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - omnitrack
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: "${OMNITRACK_HEALTHCHECK_INTERVAL_SECONDS:-30}s"
      timeout: "${OMNITRACK_HEALTHCHECK_TIMEOUT_SECONDS:-5}s"
      start_period: "${OMNITRACK_HEALTHCHECK_START_PERIOD_SECONDS:-20}s"
      retries: ${OMNITRACK_HEALTHCHECK_RETRIES:-3}

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - omnitrack
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - "redis-cli"
        - "ping"
      interval: "${OMNITRACK_HEALTHCHECK_INTERVAL_SECONDS:-30}s"
      timeout: "${OMNITRACK_HEALTHCHECK_TIMEOUT_SECONDS:-5}s"
      start_period: "${OMNITRACK_HEALTHCHECK_START_PERIOD_SECONDS:-20}s"
      retries: ${OMNITRACK_HEALTHCHECK_RETRIES:-3}

  kafka:
    image: apache/kafka:3.9.0
    environment:
      # KRaft mode (no ZooKeeper): this node is both broker and controller.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - omnitrack
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"
      interval: "${OMNITRACK_HEALTHCHECK_INTERVAL_SECONDS:-30}s"
      timeout: "${OMNITRACK_HEALTHCHECK_TIMEOUT_SECONDS:-5}s"
      start_period: "${OMNITRACK_HEALTHCHECK_START_PERIOD_SECONDS:-20}s"
      retries: ${OMNITRACK_HEALTHCHECK_RETRIES:-3}

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: omnitrack-backend:local
    env_file:
      - path: .env
        required: false
    environment:
      OMNITRACK_ENVIRONMENT: container
      OMNITRACK_POSTGRES_URL: ${OMNITRACK_POSTGRES_URL:-postgresql+psycopg://omnitrack:omnitrack@postgres:5432/omnitrack}
      OMNITRACK_REDIS_ENABLED: ${OMNITRACK_REDIS_ENABLED:-true}
      OMNITRACK_REDIS_URL: ${OMNITRACK_REDIS_URL:-redis://redis:6379/0}
      OMNITRACK_KAFKA_ENABLED: ${OMNITRACK_KAFKA_ENABLED:-true}
      OMNITRACK_KAFKA_BOOTSTRAP_SERVERS: ${OMNITRACK_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    ports:
      - "${OMNITRACK_API_PORT:-8000}:${OMNITRACK_API_PORT:-8000}"
    volumes:
      - backend-data:/app/data
    networks:
      - omnitrack
    restart: unless-stopped
    stop_grace_period: "${OMNITRACK_CONTAINER_STOP_GRACE_PERIOD_SECONDS:-15}s"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Ordering only (service_started): the backend tolerates a Kafka outage by
      # design, so it must not be hard-blocked on Kafka health. The event bus is
      # optional and gated by OMNITRACK_KAFKA_ENABLED.
      kafka:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os; from urllib.request import urlopen;
          urlopen('http://127.0.0.1:' + os.environ['OMNITRACK_API_PORT'] +
          '/health', timeout=3).read()"
      interval: "${OMNITRACK_HEALTHCHECK_INTERVAL_SECONDS:-30}s"
      timeout: "${OMNITRACK_HEALTHCHECK_TIMEOUT_SECONDS:-5}s"
      start_period: "${OMNITRACK_HEALTHCHECK_START_PERIOD_SECONDS:-20}s"
      retries: ${OMNITRACK_HEALTHCHECK_RETRIES:-3}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-/ws}
        VITE_API_KEY: ${VITE_API_KEY:-}
    image: omnitrack-frontend:local
    env_file:
      - path: .env
        required: false
    environment:
      OMNITRACK_ENVIRONMENT: container
    ports:
      - "${OMNITRACK_FRONTEND_PORT:-8080}:${OMNITRACK_FRONTEND_PORT:-8080}"
    networks:
      - omnitrack
    restart: unless-stopped
    stop_grace_period: "${OMNITRACK_CONTAINER_STOP_GRACE_PERIOD_SECONDS:-15}s"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --quiet --spider http://127.0.0.1:${OMNITRACK_FRONTEND_PORT:-8080}/healthz || exit 1"
      interval: "${OMNITRACK_HEALTHCHECK_INTERVAL_SECONDS:-30}s"
      timeout: "${OMNITRACK_HEALTHCHECK_TIMEOUT_SECONDS:-5}s"
      start_period: "${OMNITRACK_HEALTHCHECK_START_PERIOD_SECONDS:-20}s"
      retries: ${OMNITRACK_HEALTHCHECK_RETRIES:-3}

volumes:
  backend-data:
    name: omnitrack-backend-data
  postgres-data:
    name: omnitrack-postgres-data
  redis-data:
    name: omnitrack-redis-data
  kafka-data:
    name: omnitrack-kafka-data

networks:
  omnitrack:
    name: omnitrack-network
    driver: bridge
