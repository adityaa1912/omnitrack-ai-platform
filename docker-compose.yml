services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: omnitrack-backend:local
    env_file:
      - .env
    environment:
      OMNITRACK_ENVIRONMENT: container
    ports:
      - "${OMNITRACK_API_PORT}:${OMNITRACK_API_PORT}"
    volumes:
      - backend-data:/app/data
    networks:
      - omnitrack
    restart: unless-stopped
    stop_grace_period: "${OMNITRACK_CONTAINER_STOP_GRACE_PERIOD_SECONDS}s"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os; from urllib.request import urlopen;
          urlopen('http://127.0.0.1:' + os.environ['OMNITRACK_API_PORT'] +
          '/health', timeout=3).read()"
      interval: "${OMNITRACK_HEALTHCHECK_INTERVAL_SECONDS}s"
      timeout: "${OMNITRACK_HEALTHCHECK_TIMEOUT_SECONDS}s"
      start_period: "${OMNITRACK_HEALTHCHECK_START_PERIOD_SECONDS}s"
      retries: ${OMNITRACK_HEALTHCHECK_RETRIES}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL}
        VITE_API_KEY: ${VITE_API_KEY:-}
    image: omnitrack-frontend:local
    env_file:
      - .env
    environment:
      OMNITRACK_ENVIRONMENT: container
    ports:
      - "${OMNITRACK_FRONTEND_PORT}:${OMNITRACK_FRONTEND_PORT}"
    networks:
      - omnitrack
    restart: unless-stopped
    stop_grace_period: "${OMNITRACK_CONTAINER_STOP_GRACE_PERIOD_SECONDS}s"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --quiet --spider http://127.0.0.1:${OMNITRACK_FRONTEND_PORT}/healthz || exit 1"
      interval: "${OMNITRACK_HEALTHCHECK_INTERVAL_SECONDS}s"
      timeout: "${OMNITRACK_HEALTHCHECK_TIMEOUT_SECONDS}s"
      start_period: "${OMNITRACK_HEALTHCHECK_START_PERIOD_SECONDS}s"
      retries: ${OMNITRACK_HEALTHCHECK_RETRIES}

volumes:
  backend-data:
    name: omnitrack-backend-data

networks:
  omnitrack:
    name: omnitrack-network
    driver: bridge
